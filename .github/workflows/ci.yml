name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck worker
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build check
        run: npx wrangler deploy --dry-run --outdir=/tmp/build
        env:
          CLOUDFLARE_API_TOKEN: dry-run-does-not-need-auth
